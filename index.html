<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الفيزياء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --deep: #1b2a3b;
    --teal: #00b4d8;
    --teal-light: #90e0ef;
    --gold: #f4a261;
    --gold-light: #ffd6a5;
    --white: #f0f4f8;
    --muted: #8fa3b1;
    --card: #162232;
    --border: #1e3248;
    --success: #52b788;
    --error: #e76f51;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(0,180,216,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(244,162,97,0.07) 0%, transparent 50%);
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0d1b2a 0%, #162232 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
